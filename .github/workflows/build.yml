name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: Android64
          sdk: latest

      - name: Upload Geode File
        uses: actions/upload-artifact@v4
        with:
          name: Deltarune-Mod
          path: build/*.geode